# Run from this directory: harbor run -c codex.yaml
# Harbor forwards the existing ~/.codex/auth.json into each isolated trial.
n_attempts: 1
n_concurrent_trials: 3
jobs_dir: jobs
environment:
  type: docker
  import_path: surfbench.docker_environment:SurfbenchDockerEnvironment
agents:
  - name: codex
    model_name: openai/gpt-6.1-terra
    env:
      CODEX_FORCE_AUTH_JSON: "1"
    extra_allowed_hosts:
      - chatgpt.com
      - api.openai.com
      - auth.openai.com
      - ab.chatgpt.com
    kwargs:
      version: "0.164.0"
      reasoning_effort: high
      disable_web_search: true
datasets:
  - path: tasks-harbor-codex
