schema_version = "1.3"
[task]
name = "surfbench/sp012"
[metadata]
scenario_id = "SP012"
scenario_version = "0.1.1"
title = "Remote mainnet loading"
[agent]
user = "agent"
timeout_sec = 600
[environment]
docker_image = "surfbench-runtime:0.1.1"
cpus = 2
memory_mb = 2048
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "api.openai.com", "auth.openai.com", "ab.chatgpt.com", "mainnet-proxy"]
[[environment.mcp_servers]]
name = "surfpool"
transport = "stdio"
command = "/usr/local/bin/surfpool"
args = ["mcp"]
[verifier]
environment_mode = "separate"
timeout_sec = 120
[verifier.environment]
docker_image = "surfbench-verifier:0.1.1"
network_mode = "no-network"
[solution]
user = "agent"
[[artifacts]]
source = "/protected/evidence.json"
destination = "trusted/evidence.json"
[[artifacts]]
source = "/protected/observations.jsonl"
destination = "trusted/observations.jsonl"
[[artifacts]]
source = "/protected/rpc.pcap"
destination = "trusted/rpc.pcap"
[[artifacts]]
source = "/app/report.json"
destination = "report.json"
[[artifacts]]
source = "/protected/remote.jsonl"
destination = "trusted/remote.jsonl"
